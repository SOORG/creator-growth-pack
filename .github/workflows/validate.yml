name: Validate Creator Growth Pack
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Structural and policy regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify skill ZIP packaging
        run: python3 scripts/package_skills.py --check
